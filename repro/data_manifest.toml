    "circuit_heisenberg_j1j2_J1=1.0_J2=0.7_row=4_p=3_nqubits=3_2x2.json",
    "circuit_heisenberg_j1j2_J1=1.0_J2=0.8_row=4_p=3_nqubits=3_2x2.json",
    "circuit_heisenberg_j1j2_J1=1.0_J2=0.9_row=4_p=3_nqubits=3_2x2.json",
    "circuit_heisenberg_j1j2_J1=1.0_J2=1.0_row=4_p=3_nqubits=3_2x2.json",
]

[[directories]]
source = "project/results/heisenberg/figures"
destination = "results/heisenberg/processed"
purpose = "J1-J2 derived figure-ready data"
include_files = [
    "bond_energy_exact.json",
    "circuit_heisenberg_j1j2_J1=1.0_J2=0.5_row=4_p=3_nqubits=3_2x2_training_history.json",
    "heisenberg_energy_vs_J2.json",
    "heisenberg_variance_vs_samples.json",
]

[[directories]]
source = "project/results/heisenberg"
destination = "results/heisenberg/processed"
purpose = "J1-J2 derived sampling summaries"
include_files = [
    "M2_sampling.json",
    "sf.json",
]

[[directories]]
source = "project/results/reference"
destination = "results/reference"
purpose = "DMRG and PEPSKit reference data; local MPS/DMRG states are excluded"
include_files = [
    "dmrg_bulk_heisenberg_j1j2_Ly4_D2_J2scan.json",
    "dmrg_j1j2_D192_Ly4_J2scan_energyconv.json",
    "dmrg_bulk_tfim_Ly3_D2_gscan.json",
    "dmrg_bulk_tfim_Ly3_D32_gscan.json",
    "dmrg_sampling_matched_Ly4_D2_J2scan.json",
    "pepskit_results_D=2.json",
]

[[files]]
source = "project/results/mpskit_results_Ly=3_D=32.json"
destination = "results/mpskit_results_Ly=3_D=32.json"
purpose = "VUMPS/MPSKit TFIM reference data"

